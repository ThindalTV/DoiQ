# Builds and publishes the DoiQ images to GitHub Container Registry (ghcr.io).
#
#   push to main / manual run   -> :beta, :sha-<commit>
#   tag v1.2.3-beta.1 (any "-")  -> :beta, :1.2.3-beta.1
#   tag v1.2.3                   -> :latest, :1.2.3, :1.2
#
# Tests must pass before anything is pushed. Image: ghcr.io/<owner>/doiq.
name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build DoiQ.slnx -c Release
      - name: Test
        run: dotnet test DoiQ.slnx -c Release --no-build

  publish:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: doiq
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        # Registry paths must be lower case; the owner name may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Release channel
        id: channel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.channel.outputs.release == 'true' }}
            type=raw,value=beta,enable=${{ steps.channel.outputs.release != 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.channel.outputs.release == 'true' }}
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
