<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-label="DoiQ">
  <title>DoiQ</title>
  <!-- Q ring, open at the lower right where the tail leaves -->
  <path d="M93.8 72.3 A36 36 0 1 0 72.3 93.8" fill="none" stroke="#4F46E5" stroke-width="12" stroke-linecap="round"/>
  <!-- Q tail -->
  <path d="M76 76 L103 103" fill="none" stroke="#4F46E5" stroke-width="12" stroke-linecap="round"/>
  <!-- the "do": a checkmark -->
  <path d="M43 60 L55 72 L77 47" fill="none" stroke="#14B8A6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the agent: a spark sharing the list -->
  <circle cx="99" cy="21" r="8" fill="#F59E0B"/>
</svg>
